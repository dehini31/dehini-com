<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Marketing Dashboard</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css?v=5">
</head>
<body>
<!-- Marketing Dashboard : suivi quotidien, rapports hebdomadaires / mensuels, communication par canal et
     support, funnels. Connexion avec le mot de passe de /admin (même session). Toutes les données vivent
     dans ~/marketing-data/marketing.sqlite, hors de public_html (voir README.md). -->
<div id="loginView" hidden>
  <form id="loginForm">
    <div class="logo"><span class="mark"><svg viewBox="0 0 24 24"><path d="M6 17v-4M12 17V7M18 17v-7"/></svg></span><span><b>YINVESTI</b><small>Marketing Dashboard</small></span></div>
    <h1>Bon retour 👋</h1>
    <p class="muted" style="margin:6px 0 0">Connectez-vous avec le mot de passe de l'administration du site.</p>
    <input type="password" name="password" placeholder="Mot de passe" autocomplete="current-password" required aria-label="Mot de passe">
    <button class="btn pri" type="submit">Se connecter</button>
    <p class="form-err" id="loginErr"></p>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="logo"><span class="mark"><svg viewBox="0 0 24 24"><path d="M6 17v-4M12 17V7M18 17v-7"/></svg></span><span><b id="orgName">YINVESTI</b><small>Marketing Dashboard</small></span></div>
    <nav id="nav" aria-label="Navigation principale"></nav>
    <div class="side-foot">
      <div class="side-links" id="sideLinks"></div>
      <div class="user"><span class="avatar" id="avatar">M</span><span><b id="userName">Marketing</b><small>Responsable marketing</small></span><button type="button" class="icon-btn" id="logoutBtn" title="Se déconnecter" aria-label="Se déconnecter"></button></div>
    </div>
  </aside>
  <div id="main">
    <header class="top">
      <div class="top-row">
        <button id="burger" type="button" class="icon-btn round" aria-label="Ouvrir le menu"></button>
        <div class="top-title"><small id="crumb"></small><h1 id="title">Overview</h1></div>
        <div class="search" id="search">
          <input type="search" id="q" placeholder="Rechercher un lead, une action, une campagne…" autocomplete="off" aria-label="Rechercher">
          <kbd>Ctrl K</kbd>
          <div class="search-pop" id="searchPop" hidden></div>
        </div>
        <div class="top-actions">
          <div class="ctrl" id="rangeCtrl" hidden>
            <select id="rangePreset" aria-label="Période">
              <option value="7d">7 derniers jours</option>
              <option value="30d">30 derniers jours</option>
              <option value="90d">90 derniers jours</option>
              <option value="week">Cette semaine</option>
              <option value="month">Ce mois</option>
              <option value="last_month">Mois dernier</option>
              <option value="year">Cette année</option>
              <option value="custom">Période personnalisée…</option>
            </select>
            <span id="rangeCustom" class="ctrl" hidden>
              <input type="date" id="rangeFrom" aria-label="Du"> → <input type="date" id="rangeTo" aria-label="Au">
            </span>
          </div>
          <a class="icon-btn round bell" id="bell" href="#overview/daily" title="À traiter" aria-label="À traiter"></a>
          <div class="addmenu">
            <button class="btn pri" type="button" id="addBtn"></button>
            <div class="menu" id="addMenu" hidden></div>
          </div>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    </header>
    <main id="view"><p class="loading">Chargement…</p></main>
  </div>
</div>

<div id="modal" hidden><div class="box" id="modalBox"></div></div>
<div id="dlg" hidden><div class="box" id="dlgBox" role="dialog" aria-modal="true"></div></div>
<div id="tip" hidden></div>
<script src="assets/app.js?v=5"></script>
</body>
</html>
