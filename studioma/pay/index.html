<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure checkout — Studioma</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body class="pay-page">
<!-- Paiement hébergé par Paddle (assets/pay.js) : la page ne voit jamais de données de carte. -->
<main class="auth"><div class="auth-card panel" id="pay" aria-live="polite">
  <span class="logo logo-l"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5b4bff"/><rect x="7" y="8" width="5" height="16" rx="2.5" fill="#fff"/><rect x="13.5" y="8" width="5" height="11" rx="2.5" fill="#fff" opacity=".75"/><rect x="20" y="8" width="5" height="7" rx="2.5" fill="#ff7a59"/></svg><b>Studioma</b></span>
  <h1 data-title>Opening secure checkout…</h1>
  <p class="muted" data-text>Payments are processed by Paddle. Your card details never reach Studioma.</p>
  <p><a class="btn btn-ghost" href="../app/#/pricing" data-back>Back to plans</a></p>
</div></main>
<script src="../assets/pay.js"></script>
</body>
</html>
